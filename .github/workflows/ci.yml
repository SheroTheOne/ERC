name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typer, enhetstester och bygge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integrationstester mot PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # github-actions-reportern gör varje testfel till en annotering i PR:en.
      - run: npm run test:integration -- --reporter=default --reporter=github-actions
      - name: Genererade databastyper stämmer med migreringarna
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/erc_codegen
          PUBLIC_ORIGIN: http://localhost
        run: |
          psql "$TEST_DATABASE_URL" -c 'CREATE DATABASE erc_codegen'
          npm run db:migrate
          npm run db:codegen:verify

  docker:
    name: Docker Compose startar och svarar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: API och webb svarar
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/v1/health
          curl --fail --silent --show-error http://localhost:3000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
